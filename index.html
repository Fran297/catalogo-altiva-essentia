amomo, pachulí, té verde, hoja de violeta","La personalidad: cálida y definitoria"],["Notas de fondo (alma)","6 a 24 horas o más","61 a 100: la menos volátil","Sándalo, cedro, vetiver, ámbar, vainilla, almizcle, haba tonka, oud","La firma duradera: profunda y anclada"]]}},{p:"La escala de Poucher ordena las moléculas aromáticas de la más volátil (1) a la menos volátil (100). Cuanto más bajo es el número de una nota, más rápido se evapora. Por eso la salida ocupa el extremo volátil y el fondo el extremo pesado."},{p:"La dirección de la pirámide es clara: arriba la evaporación es más rápida, abajo más lenta. Las notas de salida se van primero, el corazón ocupa el centro de la experiencia y el fondo es lo que queda en la piel y en la ropa durante más tiempo."},{p:"Una regla de equilibrio que circula mucho es la 30/50/20: alrededor de 30 % de salida, 50 % de corazón y 20 % de fondo. Tomala como una guía de proporción de la composición, no como una medida exacta, porque las cifras cambian según la fuente y el perfume."},{p:"Un consejo práctico: esperá entre 30 y 60 minutos después de aplicar el perfume para sentir las notas de fondo reales. En los primeros minutos lo que percibís es casi solo la salida, y juzgar una fragancia solo por ese momento es el error más común."},{fig:"pyramid",caption:"La pirámide: cada capa aparece en un momento distinto y dura más que la anterior."},{h2:"Notas de salida: el primer saludo"},{p:"Son las que sentís apenas aplicás el perfume. Suelen ser cítricos (bergamota, limón, pomelo), hierbas frescas (menta, albahaca, lavanda), frutas verdes (manzana, pera), y en algunas fragancias especias vivas como la pimienta rosa o el té verde."},{p:"Su trabajo es atraer. Por eso son brillantes y ligeras, pero también son las primeras en irse: duran, según la fuente y la química de cada perfume, entre 5 y 30 minutos. Si una fragancia te encanta en la primera prueba y después te parece otra cosa, lo más probable es que hayas sentido solo esta capa."},{h2:"Notas de corazón: la identidad"},{p:"Cuando la salida empieza a irse, aparece el corazón. Acá están las flores (rosa, jazmín, iris, peonía), algunas especias cálidas (canela, cardamomo) y maderas o notas verdes como el pachulí. Es la parte más grande del perfume: se estima en 60 a 70 % de su perfil aromático, y dura entre 20 minutos y unas 4 horas."},{p:"Si tenés que elegir una capa para decidir si te gusta un perfume, elegí esta. Es la que vas a oler la mayor parte del tiempo que lo uses."},{h2:"Notas de fondo: lo que queda"},{p:"El fondo son las moléculas pesadas: sándalo, cedro, vetiver, ámbar, benjuí, almizcle, vainilla, haba tonka. Son lentas y se manifiestan por completo después de 2 o 3 horas, en la etapa que los perfumistas llaman dry-down."},{p:"Cuánto dura depende de la concentración. En un Eau de Parfum el fondo suele quedarse entre 6 y 12 horas sobre la piel; en un Extrait de Parfum puede llegar a 12 a 16 horas en la piel y pasar las 24 horas en la ropa. Por eso, si buscás persistencia, la concentración pesa tanto como las notas."},{fig:"duration",caption:""},{h2:"Cómo se relacionan las tres capas"},{p:"Las capas no son compartimentos separados: se superponen. La salida prepara el terreno, el corazón lo ocupa y el fondo lo envuelve. Un buen perfume tiene transiciones: no tiene que ser una sucesión de saltos, sino una curva que se entiende de principio a fin."},{p:"También hay un concepto que conviene tener: el acorde. Es la combinación de ingredientes que produce una impresión unificada, a veces imposible de separar en notas. Muchas fragancias de nicho se construyen sobre acordes, y por eso a veces cuesta identificar una flor o una madera puntual. Esto no es un defecto: es la forma en que el perfumista piensa la composición."},{h2:"Cómo darte cuenta qué parte te queda bien"},{p:"La pirámide dice cómo debería evolucionar un perfume. Pero la piel tiene la última palabra. Dos personas con el mismo frasco pueden oler cosas distintas porque el pH, la temperatura, la hidratación y hasta la genética cambian cómo se comportan las moléculas. Por eso la compatibilidad se descubre probando, no leyendo."},{p:"Lo que sí podés hacer es observar tres cosas:"},{ul:["¿Te gusta la salida, aunque dure poco? Si sí, pero el perfume después te aburre o te resulta incómodo, probablemente la compatibilidad se corta en el corazón.","¿El corazón te gusta, pero desaparece antes de lo esperado? Eso suele pasar cuando la piel está seca o cuando la concentración es baja.","¿El fondo te queda bien pero no te gusta la salida? Podés buscar un perfume con la misma base y otra apertura: muchas casas hacen variaciones."]},{fig:"test",caption:"Un protocolo simple: misma muñeca, mismos momentos, y anotá qué sentiste en cada uno."},{h2:"Protocolo de prueba en 5 pasos"},{ul:["Probá como máximo tres perfumes por tarde. Después la nariz se satura y no distingue nada.","Aplicá sobre la piel, no sobre papel secante. El papel no tiene tu química.","Esperá unos 2 minutos a que el alcohol se evapore antes de juzgar la salida.","Anotá lo que sentís a los 15 minutos, a la hora, a las 3 horas y al día siguiente. No te frotes la muñeca: el roce acelera la evaporación y cambia la nota.","Hacé la prueba nocturna: aplicalo antes de dormir y evaluá al despertar. Ahí se ve el fondo de verdad."]},{h2:"Piel, clima y cuidado"},{p:"La piel bien hidratada retiene mejor las moléculas aromáticas, así que un perfume dura más en una piel con crema que en una piel seca. El calor acelera la evaporación: en un día de 28 °C, las notas de salida pueden desaparecer en menos de 10 minutos. El frío hace lo contrario y permite que la pirámide se despliegue con más calma."},{p:"Algunas recomendaciones prácticas: guardá los frascos lejos de la luz y del calor, mantené el tapón bien cerrado y, si tu piel reacciona a algún perfume (picazón, enrojecimiento), dejá de usarlo y consultá con un profesional."},{h2:"Glosario rápido"},{ul:["Salida (top note): la primera impresión, la más volátil.","Corazón (heart note): el cuerpo del perfume y su identidad.","Fondo (base note): las notas pesadas que duran y sostienen.","Dry-down: la etapa en que el perfume se asienta y deja solo su base.","Sillage: la estela que deja el perfume al moverte.","Acorde: un conjunto de ingredientes que suena como uno solo.","Concentración: la cantidad de aceites perfumados (Eau de Parfum, Extrait, etc.), que define cuánto dura."]},{h2:"Para cerrar"},{p:"Leer la pirámide no reemplaza el olfato, pero lo entrena. Cuando sabés qué esperar de cada capa, dejás de elegir por el nombre del frasco y empezás a elegir por lo que te hace sentir. Si querés probar esto con perfumes de la colección, el quiz olfativo te ayuda a encontrar familias que combinen con tu piel y tu estilo."}],sources:[["Scento · La pirámide olfativa 2026: notas de salida, corazón y fondo","https://www.scento.com/es/blog/fragrance-pyramid-explained-top-heart-base-notes-decoded"],["Tendance Parfums · Glosario: pirámide olfativa","https://www.tendance-parfums.com/es/parfum/glossaire/pyramide-olfactive"]]},sc={slug:"decant-5ml",eyebrow:"Guía de compra",alt:"Atomizador de vidrio de 5 ml con tapa dorada",title:"El decant de 5 ml: probá un perfume antes de comprar el frasco",excerpt:"Un perfume cambia según la química de tu piel. Con 5 ml podés comprobar cómo se comporta en tu rutina antes de invertir en el frasco completo.",updated:"2026-10-30",cover:"./img/products/decant-5ml-atomizador.webp",blocks:[{p:"Comprar un perfume de nicho sin haberlo probado tiene un riesgo real: en el probador o en la descripción suena de una manera, y en tu piel puede ser otra. El decant de 5 ml existe para eso. Es una muestra en atomizador de vidrio que te permite usar la fragancia durante semanas y decidir con más información."},{h2:"Qué rinde un decant de 5 ml"},{p:"Un atomizador de 5 ml rinde aproximadamente entre 65 y 75 aplicaciones, porque cada disparo es de unos 0,07 ml. Si usás entre 3 y 4 aplicaciones por vez y lo llevás a diario, alcanza para unas tres semanas. El rendimiento varía según el atomizador y la costumbre de cada persona."},{h2:"Por qué conviene probarlo en tu piel"},{p:"La salida, el corazón y el fondo de un perfume aparecen en momentos distintos, y cómo se desarrollan depende de tu piel, tu temperatura corporal y tu rutina. Con un decant podés ver cómo evoluciona la fragancia durante horas y días, cuánto dura y qué estela deja en tu trabajo, tus salidas o tu día a día."},{h2:"Cómo elegir qué probar"},{ul:["Perfumes que están de moda y que querés conocer sin invertir en el frasco completo.","Notas intensas o polarizantes, como el oud, las especias o el cuero, que conviene probar antes de comprar.","Frascos de precio alto, donde el decant reduce la barrera de entrada.","Fragancias de estación: muy pesadas para el verano o muy frescas para el invierno."]},{h2:"Cómo pedir tu decant"},{p:"En la ficha de cada perfume elegí el formato Decant 5 ml. El precio se actualiza y el botón te lleva a WhatsApp con el pedido ya armado. Si querés confirmar disponibilidad antes, escribinos."}],sources:[]},tc={slug:"khamrah-vs-sharaf-blend",eyebrow:"Comparativa",alt:"Comparación de dos fragancias gourmand",title:"Lattafa Khamrah vs. Zimaya Sharaf Blend: ¿cuál es el rey del gourmand?",excerpt:"Dos gourmand especiados con dátiles, praliné y vainilla. Comparamos sus notas, su duración y cómo probar los dos antes de decidir.",updated:"2026-10-30",cover:"./img/familia-oriental-vainilla.webp",blocks:[{p:"Khamrah y Sharaf Blend son dos de las fragancias gourmand más comentadas del catálogo. Las dos son unisex, pensadas para el invierno y con un perfil de dátil, praliné y vainilla. Acá comparamos lo que tienen en común y lo que las separa, con los datos de nuestra planilla."},{h2:"Lo que comparten"},{p:"Las dos abren con especias cálidas, desarrollan un corazón de dátiles y praliné con tuberosa, y terminan en una base de vainilla y haba tonka. Ambas figuran con clima frío o invierno e intensidad extrema en la planilla."},{h2:"Dónde se separan"},{ul:["Salida: Khamrah abre con canela, nuez moscada y bergamota. Sharaf Blend, con nuez moscada, canela y azafrán.","Corazón: Khamrah suma mahonial. Sharaf Blend, flor de azahar del naranjo.","Fondo: Khamrah se asienta en mirra, benjuí y Akigalawood. Sharaf Blend, en benjuí y madera de ámbar.","Duración según la planilla: Khamrah, 12 a 14 horas o más. Sharaf Blend, 10 a 12 horas o más.","Proyección según la planilla: Khamrah, arrolladora (llena salones). Sharaf Blend, arrolladora (2 m)."]},{h2:"Cómo elegir"},{p:"Si te gusta un gourmand con más canela y bergamota al principio, y una base de mirra, Khamrah es la opción natural. Si preferís el azafrán y el azahar en la salida y el corazón, Sharaf Blend va por ese lado. La diferencia real se nota en la piel, así que vale la pena probar."},{h2:"Probalos antes de decidir"},{p:"Khamrah tiene decant de 5 ml en su ficha. Sharaf Blend todavía no tiene precio cargado, así que para su decant escribinos por WhatsApp."},{p:"Duraciones y proyecciones transcriptas de la planilla de Altiva Essentia. Son orientativas y pueden variar según la piel, el clima y la cantidad aplicada."}],sources:[]},Aa=({name:e,label:a,type:n="text",req:o=!0,span:i})=>r.jsxs("label",{className:"field"+(i?" field--"+i:""),children:[r.jsx("span",{children:a}),r.jsx("input",{name:e,type:n,required:o})]});function eb(){const{cart:e,subtotal:a,clearCart:n,notify:o,loyalty:i,redemption:l,setRedemption:s}=Ae(),[u,t]=P.useState("card"),[c,d]=P.useState("form"),[f,m]=P.useState(!1),[g,v]=P.useState(null),[y,z]=P.useState(""),p=a>=Rl||a===0?0:_f,h=u==="transfer"?Math.round(a*Yf):0,b=(l==null?void 0:l.discountARS)||0,A=a+p-h-b,C=async S=>{if(S.preventDefault(),f)return;const x=new FormData(S.target);m(!0),z("");try{const E={email:x.get("email"),firstName:x.get("firstName"),lastName:x.get("lastName"),phone:x.get("phone"),address:x.get("address"),city:x.get("city"),province:x.get("province"),zip:x.get("zip")};let L=i.token;L||(L=(awa
